name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vanta
          POSTGRES_PASSWORD: vanta_test_password
          POSTGRES_DB: vanta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vanta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vanta:vanta_test_password@localhost:5432/vanta_test?schema=public
      JWT_SECRET: ci_test_secret_do_not_use_in_production_0000
      REALTIME_JWT_SECRET: ci_test_secret_do_not_use_in_production_0000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vanta/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm --filter @vanta/api exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
