<!doctype html><html><head><meta charset="UTF-8"><title>VANTA Pilot</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8eef7;font:14px system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.shell{height:100vh;display:grid;grid-template-columns:210px 1fr}.nav{background:#0a1626;border-right:1px solid #1b2a3c;padding:18px}.logo{font-weight:900;font-size:22px;letter-spacing:3px;margin-bottom:26px}.nav button{width:100%;text-align:left;background:none;border:0;color:#91a2b8;padding:12px;border-radius:7px;cursor:pointer}.nav button.active,.nav button:hover{background:#102238;color:#fff}.main{padding:26px;overflow:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.status{padding:8px 12px;border:1px solid #28425b;border-radius:20px;color:#8fe0a9}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0b1829;border:1px solid #1b2a3c;border-radius:10px;padding:16px}.label{font-size:10px;color:#70839a;letter-spacing:1px}.value{font-size:22px;margin-top:8px}.form{max-width:850px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:flex;flex-direction:column;gap:6px;color:#8fa2b8;font-size:11px}.form input,.form textarea,.form select{background:#091625;border:1px solid #28405a;color:#fff;border-radius:6px;padding:10px}.full{grid-column:1/-1}.primary{background:#e8eef7;color:#07111f;border:0;border-radius:7px;padding:11px 18px;font-weight:700;cursor:pointer}.danger{background:#6d2630;color:#fff}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #1b2a3c}.muted{color:#71839a}.success{color:#8fe0a9}.error{color:#ff9b9b}@media(max-width:800px){.shell{grid-template-columns:70px 1fr}.nav button{font-size:0}.nav button:before{content:'•';font-size:18px}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}
</style></head><body><div class="shell"><nav class="nav"><div class="logo">V</div><button data-tab="home" class="active">Home</button><button data-tab="flight">Flight Plan</button><button data-tab="airports">Airports</button><button data-tab="radio">Radio</button><button data-tab="flights">Flights</button><button data-tab="settings">Settings</button></nav><main class="main"><div id="app"></div></main></div><script>
const RT='http://localhost:4001';let snap={aircraft:[],atcFrequencies:[],flightPlans:[],timestamp:0};let active='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===active));const a=snap.aircraft[0];let h='';if(active==='home')h=`<div class="header"><div><h1>VANTA Pilot</h1><p class="muted">MSFS 2020 / MSFS 2024 network client</p></div><div class="status">${a?'AIRCRAFT CONNECTED':'WAITING FOR MSFS'}</div></div><div class="grid"><div class="card"><div class="label">CALLSIGN</div><div class="value">${esc(a?.callsign||'—')}</div></div><div class="card"><div class="label">ALTITUDE</div><div class="value">${a?Math.round(a.altitudeFeet).toLocaleString()+' ft':'—'}</div></div><div class="card"><div class="label">SPEED</div><div class="value">${a&&a.groundSpeedKts?Math.round(a.groundSpeedKts)+' kt':'—'}</div></div><div class="card"><div class="label">HEADING</div><div class="value">${a?Math.round(a.headingDegrees).toString().padStart(3,'0')+'°':'—'}</div></div></div><div class="card" style="margin-top:12px"><div class="label">NETWORK</div><p>${snap.aircraft.length} live aircraft · ${snap.atcFrequencies.length} ATC positions</p><p class="muted">Start MSFS, then the SimConnect bridge will publish your aircraft automatically.</p></div>`;
if(active==='flight')h=`<h1>Flight Plan</h1><p class="muted">File your flight into the live VANTA network.</p><form id="fp" class="form"><label>Callsign<input name="callsign" value="${esc(a?.callsign||'VANTA001')}" required></label><label>Aircraft<input name="aircraftType" value="${esc(a?.aircraftType||'B738')}" required></label><label>Departure ICAO<input name="departureIcao" placeholder="EIDW" maxlength="4" required></label><label>Arrival ICAO<input name="destinationIcao" placeholder="EGKK" maxlength="4" required></label><label>Alternate ICAO<input name="alternateIcao"></label><label>Cruise altitude<input name="cruiseAltitudeFeet" type="number" value="36000"></label><label>Flight rules<select name="flightRules"><option>IFR</option><option>VFR</option></select></label><label>Route<input name="route" placeholder="PASKA P600 KONAN"></label><label class="full">Remarks<textarea name="remarks"></textarea></label><div class="full"><button class="primary">FILE FLIGHT PLAN</button> <span id="fpmsg" class="muted"></span></div></form><div class="card" style="margin-top:18px"><b>SimBrief</b><p class="muted">Use the SimBrief import button in the next release once your SimBrief account integration is configured. Manual filing already publishes immediately.</p></div>`;
if(active==='airports')h=`<h1>Airports</h1><div class="card"><p>Worldwide airport/frequency database integration is wired through the VANTA airport-data package. Search UI is ready for the database importer.</p><p class="muted">Use the web Radar airport search while the local database is being populated.</p></div>`;
if(active==='radio')h=`<h1>Radio</h1><div class="grid"><div class="card"><div class="label">COM1</div><div class="value">${a?.com1?.active?.toFixed(3)||'—'}</div></div><div class="card"><div class="label">COM2</div><div class="value">${a?.com2?.active?.toFixed(3)||'—'}</div></div><div class="card"><div class="label">SQUAWK</div><div class="value">${esc(a?.transponderCode||'—')}</div></div><div class="card"><div class="label">ATC ONLINE</div><div class="value">${snap.atcFrequencies.length}</div></div><div class="card full"><div class="label">VANTA VOICE</div><div class="value" id="radioStatus">OFFLINE</div><button id="ptt" class="primary" style="margin-top:12px;width:100%">HOLD TO TRANSMIT</button><p class="muted">Uses your active COM1/COM2 frequencies for network radio routing.</p></div></div>`;
if(active==='flights')h=`<h1>Live Flights</h1><table class="table"><thead><tr><th>Callsign</th><th>Type</th><th>Altitude</th><th>Speed</th><th>Heading</th></tr></thead><tbody>${snap.aircraft.map(x=>`<tr><td>${esc(x.callsign)}</td><td>${esc(x.aircraftType)}</td><td>${Math.round(x.altitudeFeet).toLocaleString()} ft</td><td>${x.groundSpeedKts?Math.round(x.groundSpeedKts):'—'} kt</td><td>${Math.round(x.headingDegrees).toString().padStart(3,'0')}°</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No live aircraft</td></tr>'}</tbody></table>`;
if(active==='settings')h=`<h1>Settings</h1><div class="card"><b>Realtime</b><p class="muted">${RT}</p><b>Simulator bridge</b><p class="muted">Automatically started by the desktop app when the published bridge executable is present.</p></div>`;document.getElementById('app').innerHTML=h;const f=document.getElementById('fp');if(f)f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const msg={protocol:'VANTA/1',ts:Date.now(),type:'FLIGHT_PLAN',callsign:d.callsign.toUpperCase(),aircraftType:d.aircraftType,departureIcao:d.departureIcao.toUpperCase(),destinationIcao:d.destinationIcao.toUpperCase(),alternateIcao:d.alternateIcao?d.alternateIcao.toUpperCase():null,route:d.route,cruiseAltitudeFeet:Number(d.cruiseAltitudeFeet),flightRules:d.flightRules,departureTimeUtc:null,remarks:d.remarks||null};const ws=new WebSocket('ws://localhost:4001/realtime');ws.onopen=()=>{ws.send(JSON.stringify({protocol:'VANTA/1',ts:Date.now(),type:'DEV_AUTH',role:'PILOT',clientName:'vanta-pilot-ui'}));setTimeout(()=>ws.send(JSON.stringify(msg)),100)};ws.onmessage=ev=>{if(JSON.parse(ev.data).type==='ERROR')document.getElementById('fpmsg').textContent='Error filing plan';else{document.getElementById('fpmsg').textContent='Flight plan active on VANTA';setTimeout(()=>ws.close(),300)}}};}
async function poll(){try{const r=await fetch(RT+'/snapshot',{cache:'no-store'});if(r.ok)snap=await r.json();}catch{}render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});render();poll();setInterval(poll,1000);
</script><script src="./voice-client.js">
const vantaRadio=new VantaRadio({url:RT.replace(/^http/,'ws')+'/realtime',role:'PILOT',getFrequencies:()=>{const a=snap.aircraft[0];return [a?.com1?.active,a?.com2?.active].filter(x=>x!=null)},getFrequency:()=>snap.aircraft[0]?.com1?.active??snap.aircraft[0]?.com2?.active,getCallsign:()=>snap.aircraft[0]?.callsign||'VANTA',onStatus:s=>{const e=document.getElementById('radioStatus');if(e)e.textContent=s}});
setInterval(()=>vantaRadio.sync(),1000);
document.addEventListener('pointerdown',e=>{if(e.target&&e.target.id==='ptt'){e.preventDefault();vantaRadio.startPtt()}},true);
document.addEventListener('pointerup',e=>{if(e.target&&e.target.id==='ptt'){e.preventDefault();vantaRadio.stopPtt()}},true);
document.addEventListener('pointercancel',()=>vantaRadio.stopPtt(),true);
</script></body></html>
